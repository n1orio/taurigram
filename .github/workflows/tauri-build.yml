name: Tauri build

# Собирает Taurigram под Windows (NSIS), Linux (deb + AppImage) и macOS (universal dmg).
# Нужны секреты репозитория: TELEGRAM_API_ID, TELEGRAM_API_HASH,
# TAURI_SIGNING_PRIVATE_KEY и TAURI_SIGNING_PRIVATE_KEY_PASSWORD (подпись автообновлений).
# При пуше тега v* создаётся черновик релиза с артефактами и latest.json для автообновлений.
# Версия тега должна совпадать с "version" в client/tauri/tauri.conf.json.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundles: nsis
          - platform: ubuntu-22.04
            bundles: deb,appimage
          - platform: macos-latest
            bundles: app,dmg
            target: universal-apple-darwin
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: client/tauri -> target

      - name: Install npm dependencies
        run: npm ci --allow-git=all

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WITH_UPDATER: 'true'
        with:
          projectPath: client
          args: >-
            --bundles ${{ matrix.bundles }}
            ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
            --config tauri/tauri.updater.conf.json
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Taurigram {0}', github.ref_name) || '' }}
          releaseDraft: true

      - uses: actions/upload-artifact@v4
        with:
          name: taurigram-${{ matrix.platform }}
          path: |
            client/tauri/target/release/bundle/nsis/*.exe
            client/tauri/target/release/bundle/deb/*.deb
            client/tauri/target/release/bundle/appimage/*.AppImage
            client/tauri/target/*/release/bundle/dmg/*.dmg
          if-no-files-found: ignore

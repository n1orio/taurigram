[package]
name = "taurigram"
version = "1.0.2"
description = "Taurigram — Telegram client"
repository = "https://github.com/n1orio/taurigram"
authors = ["taurigram"]
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = [ "devtools", "unstable", "config-json5", "tray-icon", "image-png", "image-ico", "macos-private-api", "macos-proxy"] }
tauri-plugin-window-state = "2.4.1"
tauri-plugin-shell = "2.3.5"
tauri-plugin-log = "2.9.0"
tauri-plugin-notification = "2.3.3"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-dialog = "2.7.2"
log = "0.4.33"
uuid = { version = "1.24.0", features = ["v4"] }
url = "2.5.8"
image      = "0.25.10"
imageproc  = "0.27.0"
ab_glyph   = "0.2.32"
tauri-plugin-os = "2.3.2"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros", "rt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "socks", "rustls-tls"] }
base64 = "0.22"
regex = "1"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
pbkdf2 = { version = "0.12", features = ["hmac"] }
aes = "0.8"
getrandom = "0.3"

[target."cfg(target_os = \"linux\")".dependencies]
notify-rust = "4.18"

[target."cfg(windows)".dependencies]
winreg = "0.55"

[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
